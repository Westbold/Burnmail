name: Maintenance Source Snapshot

on:
  push:
    branches: [maintenance/readme-private-config]
    paths: [.github/workflows/maintenance-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source
        run: git archive --format=tar HEAD > /tmp/source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-source
          path: /tmp/source.tar
          retention-days: 1
