name: Production Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_BASE_URL: ${{ secrets.SMOKE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Check privately configured deployment
        run: bun run smoke

# Normal production deploys run this same check in Cloudflare Builds automatically.
# For an optional manual GitHub run, configure SMOKE_BASE_URL as an Actions secret.
