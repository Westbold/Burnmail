name: Production Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/production-smoke.yml]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public mail DNS
        shell: bash
        run: |
          set -euo pipefail
          dig +short MX 0357000.xyz | tee /tmp/mx.txt
          test "$(grep -c 'mx.cloudflare.net' /tmp/mx.txt)" -eq 3
          dig +short TXT 0357000.xyz | grep 'include:_spf.mx.cloudflare.net'

      - name: Check HTTPS, claims, and authorization against production
        shell: python
        run: |
          import json
          import secrets
          import time
          import urllib.error
          import urllib.request

          hosts = [
              "https://temp-mail.westbold-passworthy.workers.dev",
              "https://api.0357000.xyz",
          ]

          def request(base, path, method="GET", token=None):
              headers = {"Accept": "application/json", "User-Agent": "Passworthy-Smoke/1.0"}
              if token is not None:
                  headers["Authorization"] = f"Bearer {token}"
              req = urllib.request.Request(base + path, method=method, headers=headers)
              try:
                  response = urllib.request.urlopen(req, timeout=20)
              except urllib.error.HTTPError as error:
                  response = error
              with response:
                  return response.status, json.loads(response.read())

          for base in hosts:
              for attempt in range(20):
                  try:
                      status, payload = request(base, "/health")
                      assert status == 200, (status, payload)
                      break
                  except (OSError, ValueError, AssertionError):
                      if attempt == 19:
                          raise
                      time.sleep(5)
              status, payload = request(base, "/domains")
              assert status == 200 and payload["result"] == ["0357000.xyz"], payload
              status, document = request(base, "/openapi.json")
              assert status == 200
              assert [server["url"] for server in document["servers"]] == ["/"]
              print(f"PASS {base}: HTTPS, health, owned domain, same-origin API docs")

          base = hosts[1]
          address = "smoke-" + secrets.token_hex(10) + "@0357000.xyz"
          token = secrets.token_urlsafe(32)
          wrong_token = secrets.token_urlsafe(32)
          print(f"::add-mask::{token}")
          claim_path = "/claims/" + address
          inbox_path = "/emails/" + address
          claimed = False
          try:
              assert request(base, inbox_path)[0] == 401
              status, payload = request(base, claim_path, "PUT", token)
              assert status == 200, payload
              claimed = True
              assert request(base, claim_path, "PUT", token)[0] == 200
              assert request(base, claim_path, "PUT", wrong_token)[0] == 409
              assert request(base, inbox_path, token=wrong_token)[0] == 403
              status, payload = request(base, inbox_path, token=token)
              assert status == 200 and payload["result"] == [], payload
              status, payload = request(base, "/emails/count/" + address, token=token)
              assert status == 200 and payload["result"]["count"] == 0, payload
              assert request(base, claim_path, "DELETE", wrong_token)[0] == 403
              assert request(base, "/claims/smoke@example.test", "PUT", token)[0] == 404
              print("PASS real D1: claim, idempotency, conflict, read, count, access denial")
          finally:
              if claimed:
                  status, payload = request(base, claim_path, "DELETE", token)
                  assert status == 200, payload
                  print("PASS temporary claim cleanup")
          assert request(base, inbox_path, token=token)[0] == 404
          print("PASS released inbox is inaccessible; no test inbox remains")
